# Deploy the Tali showcase site to GitHub Pages.
#
# Pushes to `master` publish the site at the Pages root. Pull requests that touch
# the site publish a preview at `/pr-preview/pr-<number>/` and receive a comment
# linking to it; closing the pull request removes the preview again.
#
# Requires Pages to be configured as "Deploy from a branch" using `gh-pages` (root).
name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "website/**"
      - ".github/workflows/github-pages.yml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - "website/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions: {}

# Both jobs commit to the same `gh-pages` branch, so they must never overlap.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build site
        working-directory: website
        env:
          SITE_BASE: /scruff/
        run: npm ci && npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          # Preserve `pr-preview/` directories owned by the preview job.
          keep_files: true

  preview:
    name: Deploy pull request preview
    # Fork pull requests only receive a read-only token, so they cannot publish.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build preview
        if: github.event.action != 'closed'
        working-directory: website
        env:
          SITE_BASE: /scruff/pr-preview/pr-${{ github.event.number }}/
        run: npm ci && npm run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: website/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
